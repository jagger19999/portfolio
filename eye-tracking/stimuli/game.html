<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏案例底图｜视觉引导</title><style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:"Microsoft YaHei",Arial,sans-serif;color:#f3f0e8}.scene{width:1920px;height:1080px;position:relative;overflow:hidden;background:linear-gradient(#17304a 0 52%,#18201c 52%)}.sky{position:absolute;inset:0 0 48%;background:radial-gradient(circle at 72% 20%,#f2d69d 0 4%,rgba(242,214,157,.18) 5% 12%,transparent 13%),linear-gradient(#17273e,#476a78 58%,#be9f70)}.mountain{position:absolute;left:-80px;right:-80px;top:280px;height:330px;background:#253c42;clip-path:polygon(0 82%,10% 30%,19% 73%,30% 22%,43% 78%,56% 35%,68% 74%,82% 17%,100% 79%,100% 100%,0 100%)}.ground{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(#26342a,#101713)}.pathway{position:absolute;left:570px;right:360px;bottom:-80px;height:610px;background:linear-gradient(90deg,#51473a,#84715a 48%,#4c4337);clip-path:polygon(38% 0,61% 0,100% 100%,0 100%)}.ruin{position:absolute;background:#414944;border:3px solid #59615a;box-shadow:inset 0 0 0 9px rgba(0,0,0,.12)}.ruin.left{left:135px;bottom:160px;width:320px;height:520px;clip-path:polygon(0 18%,22% 18%,22% 0,48% 0,48% 12%,74% 12%,74% 26%,100% 26%,100% 100%,0 100%)}.ruin.right{right:120px;bottom:90px;width:360px;height:570px;clip-path:polygon(0 30%,17% 30%,17% 13%,48% 13%,48% 0,78% 0,78% 20%,100% 20%,100% 100%,0 100%)}.door{position:absolute;left:790px;top:445px;width:330px;height:370px;border:12px solid #525b54;border-bottom:0;border-radius:150px 150px 0 0;background:linear-gradient(90deg,#171d1a,#2d3832 50%,#131916);box-shadow:0 0 45px rgba(0,0,0,.55)}.door:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#c59645;right:42px;top:200px;box-shadow:0 0 8px #d8b268}.rune{position:absolute;left:50%;top:88px;transform:translateX(-50%);width:74px;height:74px;border:5px solid #3bc7a1;transform-origin:center;rotate:45deg;opacity:.75;box-shadow:0 0 24px rgba(59,199,161,.35)}.key{position:absolute;left:414px;top:730px;width:56px;height:22px;background:#d3a94e;border-radius:10px;transform:rotate(-18deg);box-shadow:0 0 16px rgba(227,188,86,.35)}.key:before{content:"";position:absolute;left:-25px;top:-10px;width:35px;height:35px;border:8px solid #d3a94e;border-radius:50%}.key:after{content:"";position:absolute;right:-19px;top:0;width:24px;height:9px;border-bottom:8px solid #d3a94e;border-right:7px solid #d3a94e}.torch{position:absolute;width:12px;height:95px;background:#3d2b1c}.torch:after{content:"";position:absolute;width:48px;height:70px;left:-18px;top:-54px;background:radial-gradient(ellipse,#fff2a5 0 12%,#f59b3a 20% 47%,transparent 50%);filter:drop-shadow(0 0 18px #f08c32)}.t1{left:690px;top:530px}.t2{right:680px;top:530px}.hud{position:absolute;left:46px;top:40px;padding:18px 22px;border-radius:14px;background:rgba(8,12,12,.72);border:1px solid rgba(255,255,255,.12)}.hud strong{font-size:18px}.hud p{font-size:14px;color:#b5c0bb;margin:7px 0 0}.timer{position:absolute;right:48px;top:42px;font-size:24px;font-weight:700;text-shadow:0 2px 8px #000}.hint{position:absolute;right:85px;bottom:70px;width:320px;padding:18px;border:1px solid rgba(255,255,255,.14);border-radius:14px;background:rgba(7,11,10,.68);color:#aeb9b4;font-size:14px}.hint b{display:block;color:#edf3ef;margin-bottom:6px}.cross{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:rgba(255,255,255,.6)}.cross:before{width:22px;height:2px;top:10px}.cross:after{width:2px;height:22px;left:10px}
</style></head><body><div class="scene"><div class="sky"></div><div class="mountain"></div><div class="ground"></div><div class="pathway"></div><div class="ruin left"></div><div class="ruin right"></div><div class="door"><i class="rune"></i></div><i class="key"></i><i class="torch t1"></i><i class="torch t2"></i><div class="hud"><strong>遗迹之门</strong><p>找到开启石门的方法</p></div><div class="timer">00:38</div><div class="hint"><b>探索提示</b>环境中的光线和符号可能指向关键物品</div><i class="cross"></i></div></body></html>
